<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Digital Twin & Stress Test Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Three.js & Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

  <style>
    body { margin: 0; background-color: #090d16; color: #f8fafc; font-family: sans-serif; }
    #canvas-container { position: relative; width: 100%; height: 45vh; background: radial-gradient(circle, #1e293b 0%, #090d16 100%); }
    #warning-banner {
      display: none; position: absolute; top: 16px; right: 16px;
      background: rgba(220, 38, 38, 0.95); color: #fff; padding: 8px 14px;
      border-radius: 8px; font-weight: bold; font-size: 12px; z-index: 20;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.7); animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
  </style>
</head>
<body>

  <!-- 3D VIEWPORT -->
  <div id="canvas-container">
    <div id="warning-banner">⚠️ OVERHEAT FAILURE DETECTED (94°C)</div>
  </div>

  <!-- REACT MOUNT -->
  <div id="root"></div>

  <!-- THREE.JS CANVAS LOGIC -->
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x090d16, 0.08);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(4.5, 2.5, 4.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.PointLight(0x00ffcc, 3, 4);
    scene.add(light);

    const pcGroup = new THREE.Group();
    pcGroup.position.y = -0.3;
    scene.add(pcGroup);

    const frameMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.0, 2.2), new THREE.MeshStandardMaterial({ color: 0x111827 }));
    pcGroup.add(frameMesh);

    const rgbEmissiveMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 2.0 });

    const fans = [];
    for (let i = -1; i <= 1; i++) {
      const fanGroup = new THREE.Group();
      fanGroup.position.set(0, i * 0.5, 1.11);
      fanGroup.add(new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.02, 16, 32), rgbEmissiveMat));
      pcGroup.add(fanGroup);
      fans.push(fanGroup);
    }

    window.is3dOverheated = false;
    let hue = 0;

    function animate() {
      requestAnimationFrame(animate);
      if (window.is3dOverheated) {
        const flash = Math.sin(Date.now() * 0.01) > 0 ? 0xff0000 : 0x220000;
        rgbEmissiveMat.color.setHex(flash);
        rgbEmissiveMat.emissive.setHex(flash);
        fans.forEach(f => f.rotation.z -= 0.45);
      } else {
        hue = (hue + 0.002) % 1;
        rgbEmissiveMat.color.setHSL(hue, 1, 0.5);
        rgbEmissiveMat.emissive.setHSL(hue, 1, 0.5);
        fans.forEach(f => f.rotation.z -= 0.15);
      }
      pcGroup.rotation.y += 0.002;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>

  <!-- REACT DASHBOARD + CHART.JS -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    const HARDWARE_DATABASE = {
      gpus: [
        { id: 'rtx-4070ti-super', name: 'NVIDIA RTX 4070 Ti Super', vram: 16, power: 285, price: 78000 },
        { id: 'rtx-4080-super', name: 'NVIDIA RTX 4080 Super', vram: 16, power: 320, price: 102000 }
      ],
      cpus: [{ id: 'i5-14600kf', name: 'Intel Core i5-14600KF', power: 125, price: 26000 }],
      psus: [
        { id: 'psu-850w', name: '850W 80+ Gold', wattage: 850, price: 10000 },
        { id: 'psu-650w', name: '650W 80+ Bronze', wattage: 650, price: 5500 }
      ],
      coolers: [
        { id: 'cooler-aio-240', name: '240mm Liquid AIO', type: 'Liquid', price: 7000 },
        { id: 'cooler-air', name: 'Basic Air Cooler', type: 'Air', price: 1500 }
      ]
    };

    function App() {
      const [gpu, setGpu] = useState(HARDWARE_DATABASE.gpus[0]);
      const [psu, setPsu] = useState(HARDWARE_DATABASE.psus[0]);
      const [cooler, setCooler] = useState(HARDWARE_DATABASE.coolers[0]);
      const [testing, setTesting] = useState(false);

      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      const totalCost = gpu.price + psu.price + cooler.price + 35000;
      const totalPower = gpu.power + 125 + 80;

      useEffect(() => {
        const ctx = canvasRef.current.getContext('2d');
        chartRef.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: [],
            datasets: [
              { label: 'CPU Temp (°C)', data: [], borderColor: '#ef4444', tension: 0.3 },
              { label: 'Power (W)', data: [], borderColor: '#f59e0b', tension: 0.3 }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
        return () => chartRef.current?.destroy();
      }, []);

      const runTest = () => {
        setTesting(true);
        let step = 0;
        const chart = chartRef.current;
        chart.data.labels = [];
        chart.data.datasets[0].data = [];
        chart.data.datasets[1].data = [];

        const timer = setInterval(() => {
          step++;
          const temp = cooler.type === 'Air' ? 50 + step * 8 : 40 + step * 4;
          const pwr = Math.min(totalPower, 100 + step * 80);

          chart.data.labels.push(`${step}s`);
          chart.data.datasets[0].data.push(temp);
          chart.data.datasets[1].data.push(pwr);
          chart.update();

          if (step >= 6) {
            clearInterval(timer);
            setTesting(false);
            const isFailed = temp >= 90 || totalPower > psu.wattage;
            window.is3dOverheated = isFailed;
            document.getElementById('warning-banner').style.display = isFailed ? 'block' : 'none';
          }
        }, 500);
      };

      return (
        <div className="max-w-5xl mx-auto p-4 space-y-4">
          <div className="flex justify-between items-center bg-slate-800/80 p-4 rounded-lg border border-slate-700">
            <div>
              <h1 className="text-lg font-bold text-teal-400">PC Digital Twin Control Panel</h1>
              <p className="text-xs text-slate-400">Target Ceiling: ₹1,50,000</p>
            </div>
            <div className="text-sm font-bold text-emerald-400">Cost: ₹{totalCost.toLocaleString('en-IN')}</div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="bg-slate-800/50 p-4 rounded-lg border border-slate-700 space-y-3">
              <h2 className="text-xs font-bold uppercase text-slate-400">Hardware Setup</h2>
              
              <div>
                <label className="text-xs block text-slate-300">GPU</label>
                {HARDWARE_DATABASE.gpus.map(g => (
                  <button key={g.id} onClick={() => setGpu(g)} className={`w-full text-left p-2 rounded text-xs mb-1 border ${gpu.id === g.id ? 'bg-teal-950 border-teal-500' : 'bg-slate-900 border-slate-700'}`}>
                    {g.name} - ₹{g.price.toLocaleString('en-IN')}
                  </button>
                ))}
              </div>

              <div>
                <label className="text-xs block text-slate-300">Cooling</label>
                {HARDWARE_DATABASE.coolers.map(c => (
                  <button key={c.id} onClick={() => setCooler(c)} className={`w-full text-left p-2 rounded text-xs mb-1 border ${cooler.id === c.id ? 'bg-teal-950 border-teal-500' : 'bg-slate-900 border-slate-700'}`}>
                    {c.name} - ₹{c.price.toLocaleString('en-IN')}
                  </button>
                ))}
              </div>
            </div>

            <div className="bg-slate-800/50 p-4 rounded-lg border border-slate-700 flex flex-col justify-between">
              <div>
                <div className="flex justify-between items-center mb-2">
                  <h2 className="text-xs font-bold uppercase text-slate-400">Real-Time Performance Monitor</h2>
                  <button onClick={runTest} disabled={testing} className="bg-teal-500 text-slate-950 font-bold px-3 py-1 rounded text-xs">
                    {testing ? 'Testing...' : 'Run Stress Test'}
                  </button>
                </div>
                <div className="h-40 bg-slate-900 rounded p-2 border border-slate-700">
                  <canvas ref={canvasRef}></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
